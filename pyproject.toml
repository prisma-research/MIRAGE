[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirage"
version = "0.1.0"
description = "MIRAGE: Multimodal Interaction Retrieval, Attribution, and Grounding Evaluation"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["client", "harness", "scorers", "mitigations", "pipeline"]
